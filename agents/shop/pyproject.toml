[project]
name = "shop-agent"
version = "0.1.0"
description = "Shop agent: Shopify digital listings, printables, and order fulfillment"
requires-python = ">=3.12"
dependencies = ["revenue-swarm-shared", "pypdf", "pypdfium2", "weasyprint", "pillow"]

[tool.uv.sources]
revenue-swarm-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres instance",
]
addopts = "-ra --strict-markers"
