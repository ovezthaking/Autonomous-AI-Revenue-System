[project]
name = "ebook-agent"
version = "0.1.0"
description = "Ebook agent: outline, write, and assemble a book"
requires-python = ">=3.12"
dependencies = ["revenue-swarm-shared", "pypdf"]

[tool.uv.sources]
revenue-swarm-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebook_agent"]