[project]
name = "research-agent"
version = "0.1.0"
description = "Research agent: discovers affiliate programs"
requires-python = ">=3.12"
dependencies = ["revenue-swarm-shared"]

[tool.uv.sources]
revenue-swarm-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres instance",
]
addopts = "-ra --strict-markers"
