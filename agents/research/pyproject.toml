[project]
name = "research-agent"
version = "0.1.0"
description = "Research agent: discovers affiliate programs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "redis>=6.4.0",
    "revenue-swarm-shared",
    "selectolax>=0.4.12",
    "tenacity>=9.1.4",
]

[tool.uv.sources]
revenue-swarm-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres instance",
]
addopts = "-ra --strict-markers"
