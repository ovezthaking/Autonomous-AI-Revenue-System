[project]
name = "revenue-swarm-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
