[project]
name = "revenue-swarm-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "revenue-swarm-shared",
    "uvicorn>=0.52.4",
]

[tool.uv.sources]
revenue-swarm-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires a live Postgres instance (see tests/conftest.py)",
]
addopts = "-ra --strict-markers --cov=app --cov=revenue_swarm --cov-report=term-missing"

[tool.uv]
package = false
