name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync dev tools
        run: uv sync --frozen --only-dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Bandit security scan
        run: uv run bandit -r shared/src backend/app agents/*/src -ll

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aiswarm
          POSTGRES_PASSWORD: test1234
          POSTGRES_DB: swarm_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aiswarm -d swarm_db_test"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          curl -fL https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local --strip-components=1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync workspace dependencies
        run: uv sync --frozen --all-packages

      - name: Run test suite
        run: ./scripts/test.sh

  frontend:
    name: Frontend Lint, Format & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Generate Next.js route types & TypeScript typecheck
        run: |
          npx next typegen
          npx tsc --noEmit
