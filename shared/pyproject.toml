[project]
name = "revenue-swarm-shared"
version = "0.1.0"
description = "Shared models, config, and Celery app for the revenue swarm"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "httpx>=0.28.1",
    "langchain-core>=1.6.3",
    "langchain-ollama>=1.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
testing = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenue_swarm"]
