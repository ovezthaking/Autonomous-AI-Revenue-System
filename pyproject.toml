[project]
name = "revenue-swarm"
version = "0.1.0"
description = "Autonomous AI agent swarm for multi-stream revenue"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.uv.workspace]
members = ["shared", "backend", "agents/*"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 79
extend-exclude = ["backend/alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
